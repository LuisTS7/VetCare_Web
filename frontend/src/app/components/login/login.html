<div class="login-page">

  <div class="login-container">

    <!-- PANEL IZQUIERDO -->

    <section class="brand-panel">

      <div class="brand-content">

        <h1>
          VetCare Web
        </h1>

        <h2>
          Gestión veterinaria simple y organizada
        </h2>

        <p>
          Centraliza citas, mascotas y atenciones
          desde un solo sistema.
        </p>

        <div class="brand-circle">
          <span>✚</span>
        </div>

      </div>

    </section>


    <!-- PANEL DERECHO -->

    <section class="form-panel">

      <div class="login-card">

        <div class="login-header">

          <h2>
            Iniciar sesión
          </h2>

          <p>
            Ingresa tus credenciales para acceder a VetCare Web.
          </p>

        </div>


        <form
          (ngSubmit)="iniciarSesion()"
        >

          <div class="form-group">

            <label for="correo">
              Correo electrónico
            </label>

            <input
              id="correo"
              type="email"
              name="correo"
              [(ngModel)]="correo"
              placeholder="usuario@vetcare.com"
              autocomplete="username"
            />

          </div>


          <div class="form-group">

            <label for="password">
              Contraseña
            </label>

            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Ingresa tu contraseña"
              autocomplete="current-password"
            />

          </div>


          @if (mensajeError) {

            <div class="error-message">
              {{ mensajeError }}
            </div>

          }


          <button
            type="submit"
            class="login-button"
          >
            INICIAR SESIÓN
          </button>

        </form>


        <div class="authorized-text">
          Acceso exclusivo para personal autorizado.
        </div>

      </div>

    </section>

  </div>

</div>
