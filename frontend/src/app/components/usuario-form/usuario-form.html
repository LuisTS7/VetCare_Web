<div class="form-page">

  <div class="page-header">

    <div>

      <h1>
        {{
          esEdicion
            ? 'Editar usuario'
            : 'Nuevo usuario'
        }}
      </h1>

      <p>
        {{
          esEdicion
            ? 'Actualice la información, acceso y rol del usuario.'
            : 'Registre un nuevo usuario para acceder a VetCare Web.'
        }}
      </p>

    </div>

  </div>


  <section class="form-card">

    <form
      class="user-form"
      (ngSubmit)="guardar()"
    >

      <div class="form-row">

        <div class="form-group">

          <label for="nombres">
            Nombres y apellidos
          </label>

          <input
            type="text"
            id="nombres"
            name="nombres"
            [(ngModel)]="nombres"
            placeholder="Ingrese nombres y apellidos"
            required
          />

        </div>


        <div class="form-group">

          <label for="correo">
            Correo electrónico
          </label>

          <input
            type="email"
            id="correo"
            name="correo"
            [(ngModel)]="correo"
            placeholder="usuario@vetcare.com"
            autocomplete="username"
            required
          />

        </div>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label for="password">

            {{
              esEdicion
                ? 'Nueva contraseña (opcional)'
                : 'Contraseña'
            }}

          </label>

          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"

            [placeholder]="
              esEdicion
                ? 'Deje vacío para conservar la actual'
                : 'Mínimo 6 caracteres'
            "

            autocomplete="new-password"

            [required]="!esEdicion"
          />

        </div>


        <div class="form-group">

          <label for="rol">
            Rol
          </label>

          <select
            id="rol"
            name="rol"
            [(ngModel)]="rol"
            required
          >

            <option value="Administrador">
              Administrador
            </option>

            <option value="Recepcionista">
              Recepcionista
            </option>

            <option value="Médico veterinario">
              Médico veterinario
            </option>

          </select>

        </div>

      </div>


      <div class="form-row">

        <div class="form-group">

          <label for="estado">
            Estado
          </label>

          <select
            id="estado"
            name="estado"
            [(ngModel)]="estado"
            required
          >

            <option value="Activo">
              Activo
            </option>

            <option value="Inactivo">
              Inactivo
            </option>

          </select>

        </div>

      </div>


      <div class="form-actions">

        <button
          type="button"
          class="secondary-button"
          (click)="cancelar()"
        >
          Cancelar
        </button>


        <button
          type="submit"
          class="primary-button"
        >
          {{
            esEdicion
              ? 'Guardar cambios'
              : 'Guardar usuario'
          }}
        </button>

      </div>

    </form>

  </section>

</div>
