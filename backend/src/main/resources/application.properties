# Valores incluidos para la demostración académica local. Las variables son opcionales.
spring.application.name=vetcare-backend

# ===============================
# SQL SERVER
# ===============================

spring.datasource.url=jdbc:sqlserver://${VETCARE_DB_HOST:localhost}:${VETCARE_DB_PORT:1433};databaseName=${VETCARE_DB_NAME:vetcare_db};encrypt=true;trustServerCertificate=true
spring.datasource.username=${VETCARE_DB_USER:vetcare_demo}
spring.datasource.password=${VETCARE_DB_PASSWORD:VetCare_Demo2026!}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# SERVIDOR
# ===============================

server.port=8080

# ===============================
# JWT
# ===============================

vetcare.jwt.secret=${VETCARE_JWT_SECRET:VetCare-Web-Clave-Demo-Academica-2026-Solo-Local}
vetcare.jwt.expiration=28800000